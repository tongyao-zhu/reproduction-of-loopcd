[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reproduction-of-loopcd"
version = "0.1.0"
description = "Independent reproduction of Apple LoopCD, arXiv:2610.02185"
requires-python = ">=3.10"
dependencies = ["torch==2.9.0", "transformers==4.54.1", "accelerate==1.12.0", "datasets==4.0.0"]

[project.optional-dependencies]
eval = ["lm_eval==0.4.9.1"]
test = ["pytest>=8,<10"]
code = ["evalplus==0.3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
